<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="ATML icon">
  <defs>
    <linearGradient id="atml-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4C1D95"/>
      <stop offset="1" stop-color="#7C3AED"/>
    </linearGradient>
  </defs>
  <!-- rounded-square badge -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#atml-bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.25" stroke-width="3"/>
  <!-- motion-trail bars (left) -->
  <rect x="16" y="52" width="14" height="8" rx="4" fill="#FFFFFF" opacity="0.45"/>
  <rect x="16" y="66" width="22" height="8" rx="4" fill="#FFFFFF" opacity="0.65"/>
  <rect x="16" y="80" width="30" height="8" rx="4" fill="#FFFFFF" opacity="0.85"/>
  <!-- "A" letterform with play-triangle counter -->
  <path d="M64 26 L96 102 L84 102 L78 88 L50 88 L44 102 L32 102 Z" fill="#FFFFFF"/>
  <path d="M57 74 L71 74 L64 56 Z" fill="#7C3AED"/>
  <!-- play triangle merged into the A's crossbar area -->
  <path d="M60 66 L72 74 L60 82 Z" fill="#FFFFFF"/>
  <!-- 12fps film dots (bottom-right) -->
  <g fill="#FFFFFF">
    <circle cx="88" cy="96" r="2.6" opacity="0.9"/>
    <circle cx="96" cy="96" r="2.6" opacity="0.7"/>
    <circle cx="104" cy="96" r="2.6" opacity="0.5"/>
  </g>
</svg>
